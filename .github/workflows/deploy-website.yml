name: Deploy website

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and build website
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_HOST: ${{ secrets.WEBSITE_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.WEBSITE_DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.WEBSITE_DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.WEBSITE_DEPLOY_PATH }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}

    steps:
      - name: Check deployment configuration
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH TS_OAUTH_CLIENT_ID TS_AUDIENCE; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required website deployment secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:pluris-deploy
          ping: ${{ secrets.WEBSITE_DEPLOY_HOST }}

      - name: Run website deployment over SSH
        run: |
          set -euo pipefail

          deploy_key="${RUNNER_TEMP}/website-deploy-key"
          known_hosts="${RUNNER_TEMP}/website-known-hosts"
          printf '%s\n' "${DEPLOY_KEY}" > "${deploy_key}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${known_hosts}"
          chmod 600 "${deploy_key}"

          ssh \
            -i "${deploy_key}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${known_hosts}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd \"${DEPLOY_PATH:?WEBSITE_DEPLOY_PATH is required}\" && \
             ./deploy.sh"
