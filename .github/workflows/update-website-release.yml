name: Update website release metadata

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Mobile release tag to publish on the website
        required: true
        type: string

permissions: {}

jobs:
  update:
    name: Update current mobile release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${RELEASE_EVENT_TAG:-${RELEASE_INPUT_TAG}}" >> "$GITHUB_OUTPUT"

      - name: Generate website release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: scripts/update-website-release.sh

      - name: Commit website release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/src/lib/release.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore(website): update mobile release metadata"
          git push origin HEAD:main
