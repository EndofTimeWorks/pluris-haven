name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate source branch name
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch="${HEAD_BRANCH:-${REF_NAME}}"
          scripts/check-branch-name.sh "${branch}"

  quality:
    name: Repository quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.5
          install_args: actionlint

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install repository tooling
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Require pinned deployment images
        shell: bash
        run: |
          set -euo pipefail
          if rg -n '^\s*image:' server/compose.yml | rg -v '@sha256:'; then
            echo 'Deployment images must be pinned by digest.' >&2
            exit 1
          fi

      - name: Check localisation catalogues
        run: pnpm check:l10n

      - name: Reject hardcoded mobile UI strings
        run: pnpm check:ui-l10n

      - name: Lint pull request commit messages
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from="${{ github.event.pull_request.base.sha }}"
          --to="${{ github.event.pull_request.head.sha }}"
          --verbose

  release-note-preview:
    name: Release note preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate informational release-note preview
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/generate-release-notes.mjs --from "${BASE_SHA}" --to "${HEAD_SHA}" > RELEASE_NOTES_PREVIEW.md

      - name: Upload release-note preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes-pr-${{ github.event.pull_request.number }}
          path: RELEASE_NOTES_PREVIEW.md
          if-no-files-found: error

  mobile:
    name: Mobile (analyze + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart format --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned build)
    runs-on: macos-26-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Select Xcode 26.4.1
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >
          flutter build ios --release --no-codesign
          --dart-define=SENTRY_ENABLED=true
          --dart-define=SENTRY_DSN="$SENTRY_DSN"
          --dart-define=SENTRY_ENVIRONMENT=development

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/Payload/Runner.app
          (
            cd build/ios
            ditto -c -k --keepParent Payload pluris-haven-dev-unsigned.ipa
          )

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-ios-unsigned-ipa
          path: mobile/build/ios/pluris-haven-dev-unsigned.ipa
          if-no-files-found: error

  website:
    name: Website (check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --prod=false

      - run: pnpm check

      - run: pnpm build

      - name: Check generated-page accessibility contract
        run: pnpm check:a11y

      - name: Check generated security-header contract
        run: pnpm check:headers

  server:
    name: Server (lint + test + migration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
        env:
          POSTGRES_DB: pluris_ci
          POSTGRES_USER: pluris
          POSTGRES_PASSWORD: pluris-ci-password
        options: >-
          --health-cmd "pg_isready -U pluris -d pluris_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - run: uv sync --frozen --dev

      - run: uv run ruff format --check .

      - run: uv run ruff check .

      - run: uv run --with pyright pyright pluris_server

      - run: shellcheck deploy/*.sh

      - run: uv run pytest -q

      - name: Audit Python dependencies
        run: uv run --with pip-audit pip-audit --local

      - name: Verify migrations
        env:
          PLURIS_ENVIRONMENT: test
          PLURIS_DATABASE_URL: sqlite+aiosqlite:////tmp/pluris-ci-migration.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Verify PostgreSQL migrations
        env:
          PLURIS_ENVIRONMENT: test
          PLURIS_DATABASE_URL: postgresql+asyncpg://pluris:pluris-ci-password@127.0.0.1:5432/pluris_ci
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Build server container
        run: docker build --tag pluris-haven-server:ci .

      - name: Smoke-test server container
        run: >-
          docker run --rm
          -e PLURIS_ENVIRONMENT=test
          -e PLURIS_JWT_SECRET=ci-smoke-test-jwt-secret-not-for-production
          -e PLURIS_FRIEND_CODE_PEPPER=ci-smoke-test-pepper-not-for-production
          pluris-haven-server:ci
          python -c "import pluris_server.main"

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
          - language: javascript-typescript
            os: ubuntu-latest
          - language: python
            os: ubuntu-latest
          - language: java-kotlin
            os: ubuntu-latest
            build-name: Android app for CodeQL
            build-mode: manual
            build-command: flutter build apk --debug

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: matrix.build-mode == 'manual'
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Initialize CodeQL
        if: matrix.build-mode != 'manual'
        uses: github/codeql-action/init@fb84f6228fd846d3c392887f22b18ce2d9139495 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Initialize CodeQL for compiled language
        if: matrix.build-mode == 'manual'
        uses: github/codeql-action/init@fb84f6228fd846d3c392887f22b18ce2d9139495 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: manual

      - name: Build ${{ matrix.build-name }}
        if: matrix.build-mode == 'manual'
        run: |
          flutter pub get
          ${{ matrix.build-command }}
        working-directory: mobile

      - uses: github/codeql-action/analyze@fb84f6228fd846d3c392887f22b18ce2d9139495 # v4
        with:
          category: '/language:${{ matrix.language }}'

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - branch-policy
      - quality
      - mobile
      - ios
      - website
      - server
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every validation job to succeed
        shell: bash
        env:
          BRANCH_POLICY: ${{ needs.branch-policy.result }}
          QUALITY: ${{ needs.quality.result }}
          MOBILE: ${{ needs.mobile.result }}
          IOS: ${{ needs.ios.result }}
          WEBSITE: ${{ needs.website.result }}
          SERVER: ${{ needs.server.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          for check in BRANCH_POLICY QUALITY MOBILE IOS WEBSITE SERVER CODEQL; do
            if [[ "${!check}" != 'success' ]]; then
              echo "${check} did not succeed: ${!check}" >&2
              exit 1
            fi
          done
