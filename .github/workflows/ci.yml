name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    name: Repository quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.5
          install_args: actionlint

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install repository tooling
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Require pinned deployment images
        shell: bash
        run: |
          set -euo pipefail
          if rg -n '^\s*image:' server/compose.yml | rg -v '@sha256:'; then
            echo 'Deployment images must be pinned by digest.' >&2
            exit 1
          fi

      - name: Check localisation catalogues
        run: pnpm check:l10n

      - name: Reject hardcoded mobile UI strings
        run: pnpm check:ui-l10n

      - name: Lint pull request commit messages
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from="${{ github.event.pull_request.base.sha }}"
          --to="${{ github.event.pull_request.head.sha }}"
          --verbose

  mobile:
    name: Mobile (analyze + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart format --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --debug

      - name: Configure Android release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ../scripts/configure-android-signing.sh

      - name: Build signed dev release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >
          flutter build apk --release
          --dart-define=SENTRY_ENABLED=true
          --dart-define=SENTRY_DSN="$SENTRY_DSN"
          --dart-define=SENTRY_ENVIRONMENT=development

      - name: Upload signed dev release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-dev-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Remove Android signing material
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -f android/key.properties android/app/pluris-haven-upload.jks

  mobile-dev-release:
    name: Publish mobile dev prerelease
    needs:
      - mobile
      - ios
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve dev version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version_line="$(awk '/^version:/ {print $2}' mobile/pubspec.yaml)"
          version="${version_line%%+*}"
          build="${version_line##*+}"
          tag="mobile-v${version_line}"

          if [[ -z "${version_line}" || "${version_line}" == "${version}" ]]; then
            echo "mobile/pubspec.yaml must contain a version with +build metadata." >&2
            exit 1
          fi
          if [[ ! "${build}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid Android build number: ${build}" >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-pre-alpha(\.[0-9]+)?\.dev\.[0-9]+$ ]]; then
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
            echo "Version ${version_line} is not a dev prerelease." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          max_tagged_build="$(git tag --list 'mobile-v*+*' | sed -n 's/.*+\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)"
          max_tagged_build="${max_tagged_build:-0}"
          if (( build <= max_tagged_build )) || git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
            echo "Dev prerelease ${version_line} is not newer than the published mobile tags." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          {
            echo "version=${version}"
            echo "build=${build}"
            echo "tag=${tag}"
            echo "should_publish=true"
          } >> "${GITHUB_OUTPUT}"

      - name: Download signed dev release APK
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluris-haven-dev-release-apk
          path: release/mobile-dev/raw

      - name: Download unsigned dev IPA
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluris-haven-ios-unsigned-ipa
          path: release/mobile-dev/raw

      - name: Collect dev release
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release/mobile-dev
          cp release/mobile-dev/raw/app-release.apk release/mobile-dev/pluris-haven-dev.apk
          cp release/mobile-dev/raw/pluris-haven-dev-unsigned.ipa \
            release/mobile-dev/pluris-haven-dev-unsigned.ipa
          {
            echo "version=${{ steps.version.outputs.version }}"
            echo "build=${{ steps.version.outputs.build }}"
            echo "tag=${{ steps.version.outputs.tag }}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release/mobile-dev/BUILD.txt
          (cd release/mobile-dev && sha256sum ./*.apk ./*.ipa BUILD.txt > SHA256SUMS.txt)

      - name: Publish dev prerelease
        if: steps.version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            release/mobile-dev/pluris-haven-dev.apk \
            release/mobile-dev/pluris-haven-dev-unsigned.ipa \
            release/mobile-dev/BUILD.txt \
            release/mobile-dev/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "Pluris Haven Mobile pre-alpha dev ${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}" \
            --notes "Release-mode Android APK and unsigned iOS IPA from ${GITHUB_SHA}." \
            --generate-notes \
            --prerelease \
            --latest=false

  ios:
    name: iOS (unsigned build)
    runs-on: macos-26-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Select Xcode 26.4.1
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >
          flutter build ios --release --no-codesign
          --dart-define=SENTRY_ENABLED=true
          --dart-define=SENTRY_DSN="$SENTRY_DSN"
          --dart-define=SENTRY_ENVIRONMENT=development

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/Payload/Runner.app
          (
            cd build/ios
            ditto -c -k --keepParent Payload pluris-haven-dev-unsigned.ipa
          )

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-ios-unsigned-ipa
          path: mobile/build/ios/pluris-haven-dev-unsigned.ipa
          if-no-files-found: error

  website:
    name: Website (check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --prod=false

      - run: pnpm check

      - run: pnpm build

      - name: Check generated-page accessibility contract
        run: pnpm check:a11y

      - name: Check generated security-header contract
        run: pnpm check:headers

  server:
    name: Server (lint + test + migration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
        env:
          POSTGRES_DB: pluris_ci
          POSTGRES_USER: pluris
          POSTGRES_PASSWORD: pluris-ci-password
        options: >-
          --health-cmd "pg_isready -U pluris -d pluris_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - run: uv sync --frozen --dev

      - run: uv run ruff format --check .

      - run: uv run ruff check .

      - run: uv run --with pyright pyright pluris_server

      - run: shellcheck deploy/*.sh

      - run: uv run pytest -q

      - name: Audit Python dependencies
        run: uv run --with pip-audit pip-audit --local

      - name: Verify migrations
        env:
          PLURIS_ENVIRONMENT: test
          PLURIS_DATABASE_URL: sqlite+aiosqlite:////tmp/pluris-ci-migration.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Verify PostgreSQL migrations
        env:
          PLURIS_ENVIRONMENT: test
          PLURIS_DATABASE_URL: postgresql+asyncpg://pluris:pluris-ci-password@127.0.0.1:5432/pluris_ci
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Build server container
        run: docker build --tag pluris-haven-server:ci .

      - name: Smoke-test server container
        run: >-
          docker run --rm
          -e PLURIS_ENVIRONMENT=test
          -e PLURIS_JWT_SECRET=ci-smoke-test-jwt-secret-not-for-production
          -e PLURIS_FRIEND_CODE_PEPPER=ci-smoke-test-pepper-not-for-production
          pluris-haven-server:ci
          python -c "import pluris_server.main"

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
          - language: javascript-typescript
            os: ubuntu-latest
          - language: python
            os: ubuntu-latest
          - language: java-kotlin
            os: ubuntu-latest
            build-name: Android app for CodeQL
            build-mode: manual
            build-command: flutter build apk --debug

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: matrix.build-mode == 'manual'
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Initialize CodeQL
        if: matrix.build-mode != 'manual'
        uses: github/codeql-action/init@fb84f6228fd846d3c392887f22b18ce2d9139495 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Initialize CodeQL for compiled language
        if: matrix.build-mode == 'manual'
        uses: github/codeql-action/init@fb84f6228fd846d3c392887f22b18ce2d9139495 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: manual

      - name: Build ${{ matrix.build-name }}
        if: matrix.build-mode == 'manual'
        run: |
          flutter pub get
          ${{ matrix.build-command }}
        working-directory: mobile

      - uses: github/codeql-action/analyze@fb84f6228fd846d3c392887f22b18ce2d9139495 # v4
        with:
          category: '/language:${{ matrix.language }}'
