name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    name: Repository quality gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install repository tooling
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - name: Require pinned deployment images
        shell: bash
        run: |
          set -euo pipefail
          if rg -n '^\s*image:' server/compose.yml | rg -v '@sha256:'; then
            echo 'Deployment images must be pinned by digest.' >&2
            exit 1
          fi

      - name: Check localisation catalogues
        run: pnpm check:l10n

      - name: Reject hardcoded mobile UI strings
        run: pnpm check:ui-l10n

      - name: Lint pull request commit messages
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from="${{ github.event.pull_request.base.sha }}"
          --to="${{ github.event.pull_request.head.sha }}"
          --verbose

  mobile:
    name: Mobile (analyze + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart format --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --debug

      - name: Configure Android release signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ../scripts/configure-android-signing.sh

      - name: Build signed dev release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flutter build apk --release

      - name: Upload signed dev release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-dev-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Remove Android signing material
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -f android/key.properties android/app/pluris-haven-upload.jks

  mobile-dev-release:
    name: Publish mobile dev prerelease
    needs: mobile
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve dev version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version_line="$(awk '/^version:/ {print $2}' mobile/pubspec.yaml)"
          version="${version_line%%+*}"
          build="${version_line##*+}"
          tag="mobile-v${version_line}"

          if [[ -z "${version_line}" || "${version_line}" == "${version}" ]]; then
            echo "mobile/pubspec.yaml must contain a version with +build metadata." >&2
            exit 1
          fi
          if [[ ! "${build}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid Android build number: ${build}" >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-pre-alpha(\.[0-9]+)?\.dev\.[0-9]+$ ]]; then
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
            echo "Version ${version_line} is not a dev prerelease." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          max_tagged_build="$(git tag --list 'mobile-v*+*' | sed -n 's/.*+\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)"
          max_tagged_build="${max_tagged_build:-0}"
          if (( build <= max_tagged_build )) || git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
            echo "Dev prerelease ${version_line} is not newer than the published mobile tags." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          {
            echo "version=${version}"
            echo "build=${build}"
            echo "tag=${tag}"
            echo "should_publish=true"
          } >> "${GITHUB_OUTPUT}"

      - name: Download signed dev release APK
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pluris-haven-dev-release-apk
          path: release/mobile-dev/raw

      - name: Collect dev release
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release/mobile-dev
          cp release/mobile-dev/raw/app-release.apk release/mobile-dev/pluris-haven-dev.apk
          {
            echo "version=${{ steps.version.outputs.version }}"
            echo "build=${{ steps.version.outputs.build }}"
            echo "tag=${{ steps.version.outputs.tag }}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release/mobile-dev/BUILD.txt
          (cd release/mobile-dev && sha256sum pluris-haven-dev.apk BUILD.txt > SHA256SUMS.txt)

      - name: Publish dev prerelease
        if: steps.version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            release/mobile-dev/pluris-haven-dev.apk \
            release/mobile-dev/BUILD.txt \
            release/mobile-dev/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "Pluris Haven Mobile pre-alpha dev ${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}" \
            --notes "Pre-alpha release-mode build from ${GITHUB_SHA}, signed with the Android upload key." \
            --generate-notes \
            --prerelease \
            --latest=false

  ios:
    name: iOS (unsigned build)
    runs-on: macos-26-intel
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Select Xcode 26.4.1
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-ios-unsigned
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: error

  website:
    name: Website (check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --prod=false

      - run: pnpm check

      - run: pnpm build

      - name: Check generated-page accessibility contract
        run: pnpm check:a11y

      - name: Check generated security-header contract
        run: pnpm check:headers

  server:
    name: Server (lint + test + migration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - run: uv sync --frozen --dev

      - run: uv run ruff format --check .

      - run: uv run ruff check .

      - run: shellcheck deploy/*.sh

      - run: uv run pytest -q

      - name: Verify migrations
        env:
          PLURIS_ENVIRONMENT: test
          PLURIS_DATABASE_URL: sqlite+aiosqlite:////tmp/pluris-ci-migration.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
          - language: javascript-typescript
            os: ubuntu-latest
          - language: python
            os: ubuntu-latest
          - language: java-kotlin
            os: ubuntu-latest
            build-name: Android app for CodeQL
            build-mode: manual
            build-command: flutter build apk --debug

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: matrix.build-mode == 'manual'
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Initialize CodeQL
        if: matrix.build-mode != 'manual'
        uses: github/codeql-action/init@fb84f6228fd846d3c392887f22b18ce2d9139495 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Initialize CodeQL for compiled language
        if: matrix.build-mode == 'manual'
        uses: github/codeql-action/init@fb84f6228fd846d3c392887f22b18ce2d9139495 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: manual

      - name: Build ${{ matrix.build-name }}
        if: matrix.build-mode == 'manual'
        run: |
          flutter pub get
          ${{ matrix.build-command }}
        working-directory: mobile

      - uses: github/codeql-action/analyze@fb84f6228fd846d3c392887f22b18ce2d9139495 # v4
        with:
          category: '/language:${{ matrix.language }}'
