name: Mobile Release

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer version, e.g. 0.0.1-pre-alpha.1'
        required: true
      build_number:
        description: 'Android/iOS build number'
        required: true
        default: '1'
      prerelease:
        description: 'Create a prerelease'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    name: Verify unsigned iOS build
    runs-on: macos-26-intel
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Select Xcode 26.4.1
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-ios-unsigned
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: error

  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    needs: ios
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            semver="${GITHUB_REF_NAME#mobile-v}"
            version="${semver%%+*}"
            build_name="${version}"
            if [[ "${semver}" == *"+"* ]]; then
              build="${semver##*+}"
            else
              build="${GITHUB_RUN_NUMBER}"
            fi
            tag="${GITHUB_REF_NAME}"
            if [[ "${build_name}" == 0.* || "${version}" == *-* ]]; then
              prerelease=true
            else
              prerelease=false
            fi
          else
            version="${{ inputs.version }}"
            build_name="${version}"
            build="${{ inputs.build_number }}"
            tag="mobile-v${version}+${build}"
            prerelease="${{ inputs.prerelease }}"
          fi

          if [[ ! "${version}" =~ ${semver_regex} ]]; then
            echo "Invalid version: ${version}" >&2
            exit 1
          fi
          if [[ ! "${build}" =~ ^[0-9]+$ ]]; then
            echo "Invalid build number: ${build}" >&2
            exit 1
          fi
          max_tagged_build="$(git tag --list 'mobile-v*+*' | sed -n 's/.*+\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)"
          max_tagged_build="${max_tagged_build:-0}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if (( build < max_tagged_build )); then
              echo "Tagged Android build number ${build} is older than the highest tagged mobile build ${max_tagged_build}." >&2
              echo "Refusing to build an APK Android/Obtainium would treat as older." >&2
              exit 1
            fi
          elif (( build <= max_tagged_build )); then
            echo "Android build number ${build} is not newer than the highest tagged mobile build ${max_tagged_build}." >&2
            echo "Use a larger build_number so Android/Obtainium can update existing installs." >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build_name=${build_name}" >> "${GITHUB_OUTPUT}"
          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Android signing secrets are not configured." >&2
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/pluris-haven-upload.jks
          if ! keytool -list -keystore android/app/pluris-haven-upload.jks -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" >/dev/null 2>&1; then
            echo "Android signing key alias was not found in the uploaded keystore." >&2
            echo "Set ANDROID_KEY_ALIAS to the alias used with keytool -genkeypair, usually pluris-haven-upload." >&2
            exit 1
          fi
          {
            echo "storeFile=pluris-haven-upload.jks"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > android/key.properties

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter --no-color analyze

      - name: Test
        run: flutter --no-color test

      - name: Build release APK
        run: >
          flutter --no-color build apk --release
          --build-name "${{ steps.version.outputs.build_name }}"
          --build-number "${{ steps.version.outputs.build }}"

      - name: Build split per ABI APKs
        run: >
          flutter --no-color build apk --release --split-per-abi
          --build-name "${{ steps.version.outputs.build_name }}"
          --build-number "${{ steps.version.outputs.build }}"

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../release/mobile
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../release/mobile/pluris-haven-${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}-universal.apk"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="${apk#build/app/outputs/flutter-apk/app-}"
            abi="${abi%-release.apk}"
            cp "${apk}" "../release/mobile/pluris-haven-${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}-${abi}.apk"
          done
          {
            echo "version=${{ steps.version.outputs.version }}"
            echo "build=${{ steps.version.outputs.build }}"
            echo "tag=${{ steps.version.outputs.tag }}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ../release/mobile/BUILD.txt
          (cd ../release/mobile && sha256sum *.apk BUILD.txt > SHA256SUMS.txt)

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-mobile-release
          path: release/mobile/*
          if-no-files-found: error

      - name: Create GitHub Release
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          prerelease_flag=()
          latest_flag=()
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            prerelease_flag=(--prerelease)
            latest_flag=(--latest=false)
          else
            prerelease_flag=(--prerelease=false)
            latest_flag=(--latest)
          fi

          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ steps.version.outputs.tag }}" \
              --title "Pluris Haven Mobile ${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}" \
              "${prerelease_flag[@]}" \
              "${latest_flag[@]}"
            gh release upload "${{ steps.version.outputs.tag }}" release/mobile/* --clobber
          else
            gh release create "${{ steps.version.outputs.tag }}" \
              release/mobile/* \
              --title "Pluris Haven Mobile ${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}" \
              --generate-notes \
              --verify-tag \
              "${latest_flag[@]}" \
              "${prerelease_flag[@]}"
          fi
