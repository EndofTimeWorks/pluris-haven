name: Mobile Release

on:
  push:
    tags:
      - 'mobile-v*'
      - '!mobile-v*.dev.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_sha: ${{ steps.version.outputs.release_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          trusted_manual_fingerprint='1B6BE8AB1CAD7BB96CCE5C6FD26A61973E7ACB14'
          trusted_ci_signing_fingerprint='BF89ABFBD583200EB70E43FA46525A21A09A8888'
          GNUPGHOME="${RUNNER_TEMP}/pluris-haven-official-release/tag-verification"
          rm -rf "${GNUPGHOME}"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"
          export GNUPGHOME
          trap 'rm -rf "${GNUPGHOME}"' EXIT
          gpg --batch --import .github/keys/pluris-haven-release-tag.asc >/dev/null
          imported_fingerprint="$(
            gpg --batch --with-colons --fingerprint "${trusted_manual_fingerprint}" |
              awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          if [[ "${imported_fingerprint}" != "${trusted_manual_fingerprint}" ]]; then
            echo 'Trusted release signing key fingerprint does not match.' >&2
            exit 1
          fi
          if ! git cat-file -e "${GITHUB_REF_NAME}^{tag}" 2>/dev/null; then
            echo 'Mobile release ref must be an annotated tag.' >&2
            exit 1
          fi
          if ! git verify-tag "${GITHUB_REF_NAME}"; then
            tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
            verification="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification')"
            if [[ "$(jq -r '.verified' <<<"${verification}")" != true ]] || \
              ! jq -r '.signature // empty' <<<"${verification}" | gpg --list-packets 2>/dev/null | grep -Fq "issuer fpr v4 ${trusted_ci_signing_fingerprint}"; then
              echo 'Mobile release tag must have a valid trusted manual or CI signing identity.' >&2
              exit 1
            fi
          fi

          semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          version_with_build="${GITHUB_REF_NAME#mobile-v}"
          if [[ "${version_with_build}" != *"+"* ]]; then
            echo "Mobile release tag must include a numeric build number." >&2
            exit 1
          fi

          version="${version_with_build%%+*}"
          build="${version_with_build##*+}"
          if [[ ! "${version}" =~ ${semver_regex} ]]; then
            echo "Invalid version: ${version}" >&2
            exit 1
          fi
          if [[ ! "${build}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid build number: ${build}" >&2
            exit 1
          fi
          if [[ "${version}" == *.dev.* ]]; then
            echo "Versioned mobile releases cannot use a .dev.N version." >&2
            exit 1
          fi

          release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo 'Official mobile releases must target a commit contained in main.' >&2
            exit 1
          fi
          if [[ "$(git rev-parse origin/main)" != "${release_commit}" ]]; then
            echo 'ABORT — release marker is no longer the current main tip.' >&2
            exit 1
          fi
          expected_subject="release: ${version}"
          actual_subject="$(git show -s --format=%s "${release_commit}")"
          if [[ "${actual_subject}" != "${expected_subject}" ]]; then
            echo "Mobile release tag must point directly at '${expected_subject}'." >&2
            exit 1
          fi

          node scripts/check-mobile-release-version.mjs \
            "${version_with_build}" "${GITHUB_REF_NAME}"
          if ! grep -Fq "${version_with_build}" CHANGELOG.md; then
            echo "CHANGELOG.md does not mention ${version_with_build}." >&2
            exit 1
          fi

          prerelease=false
          if [[ "${version}" == 0.* || "${version}" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "version=${version}"
            echo "build=${build}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "prerelease=${prerelease}"
            echo "release_sha=${release_commit}"
          } >> "${GITHUB_OUTPUT}"

  ios:
    name: Verify unsigned iOS build
    needs: metadata
    runs-on: macos-26-intel
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Select Xcode 26.4.1
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >
          flutter build ios --release --no-codesign
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build }}"
          --dart-define=SENTRY_ENABLED=true
          --dart-define=SENTRY_DSN="$SENTRY_DSN"
          --dart-define=SENTRY_ENVIRONMENT=production

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/ios/unsigned/Payload
          ditto build/ios/iphoneos/Runner.app \
            build/ios/unsigned/Payload/Runner.app
          (
            cd build/ios/unsigned
            ditto -c -k --keepParent Payload \
              "../pluris-haven-${{ needs.metadata.outputs.version }}+${{ needs.metadata.outputs.build }}-unsigned.ipa"
          )

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-ios-unsigned
          path: mobile/build/ios/pluris-haven-*-unsigned.ipa
          if-no-files-found: error

  android:
    name: Build Android release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: metadata
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter --no-color analyze

      - name: Test
        run: flutter --no-color test

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ../scripts/configure-android-signing.sh

      - name: Build release APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >
          flutter --no-color build apk --release
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build }}"
          --dart-define=SENTRY_ENABLED=true
          --dart-define=SENTRY_DSN="$SENTRY_DSN"
          --dart-define=SENTRY_ENVIRONMENT=production

      - name: Build release app bundle
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >
          flutter --no-color build appbundle --release
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build }}"
          --dart-define=SENTRY_ENABLED=true
          --dart-define=SENTRY_DSN="$SENTRY_DSN"
          --dart-define=SENTRY_ENVIRONMENT=production

      - name: Build split per ABI APKs
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: >
          flutter --no-color build apk --release --split-per-abi
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build }}"
          --dart-define=SENTRY_ENABLED=true
          --dart-define=SENTRY_DSN="$SENTRY_DSN"
          --dart-define=SENTRY_ENVIRONMENT=production

      - name: Collect Android artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../release/android
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../release/android/pluris-haven-${{ needs.metadata.outputs.version }}+${{ needs.metadata.outputs.build }}-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "../release/android/pluris-haven-${{ needs.metadata.outputs.version }}+${{ needs.metadata.outputs.build }}.aab"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="${apk#build/app/outputs/flutter-apk/app-}"
            abi="${abi%-release.apk}"
            cp "${apk}" "../release/android/pluris-haven-${{ needs.metadata.outputs.version }}+${{ needs.metadata.outputs.build }}-${abi}.apk"
          done

      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-android-release
          path: release/android/*
          if-no-files-found: error

      - name: Remove Android signing material
        if: always()
        run: rm -f android/key.properties android/app/pluris-haven-upload.jks

  play-internal:
    name: Upload app bundle to Play internal testing
    needs:
      - metadata
      - android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out verified release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          persist-credentials: false

      - name: Download Android artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluris-haven-android-release
          path: release/android

      - name: Authenticate to Google Play
        id: play-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false

      - name: Commit app bundle to the configured testing track
        shell: bash
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          PLAY_BUILD: ${{ needs.metadata.outputs.build }}
          PLAY_VERSION: ${{ needs.metadata.outputs.version }}
          PLAY_TRACK: internal
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.metadata.outputs.release_sha }}
          PLAY_APP_SIGNING_CERT_SHA256: ${{ vars.PLURIS_PLAY_APP_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail

          : "${PLAY_ACCESS_TOKEN:?Google Play access token was not generated.}"
          : "${PLAY_APP_SIGNING_CERT_SHA256:?PLURIS_PLAY_APP_SIGNING_CERT_SHA256 is not configured.}"
          if [[ "${PLAY_TRACK,,}" == production ]]; then
            echo 'Official automation must never target the Play production track.' >&2
            exit 1
          fi
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${RELEASE_SHA}" || {
            echo 'ABORT — release marker is no longer the current main tip.' >&2
            exit 1
          }
          bundle="release/android/pluris-haven-${PLAY_VERSION}+${PLAY_BUILD}.aab"
          test -f "${bundle}" || { echo "Missing release app bundle: ${bundle}" >&2; exit 1; }

          package_name='works.endoftime.plurishaven'
          publisher_base='https://androidpublisher.googleapis.com/androidpublisher/v3'
          authorization="Authorization: Bearer ${PLAY_ACCESS_TOKEN}"

          edit="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "${authorization}" \
              --header 'Content-Type: application/json' \
              "${publisher_base}/applications/${package_name}/edits"
          )"
          edit_id="$(jq -er '.id' <<<"${edit}")"

          uploaded_bundle="$(
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "${authorization}" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary @"${bundle}" \
              "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/${package_name}/edits/${edit_id}/bundles"
          )"
          version_code="$(jq -er '.versionCode | tostring' <<<"${uploaded_bundle}")"
          if [[ "${version_code}" != "${PLAY_BUILD}" ]]; then
            echo "Uploaded bundle version code ${version_code} does not match ${PLAY_BUILD}." >&2
            exit 1
          fi

          release="$(jq -nc --arg version_code "${version_code}" \
            '{releases: [{versionCodes: [$version_code], status: "completed"}]}')"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "${authorization}" \
            --header 'Content-Type: application/json' \
            --data "${release}" \
            "${publisher_base}/applications/${package_name}/edits/${edit_id}/tracks/${PLAY_TRACK}" \
            >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${RELEASE_SHA}" || {
            echo 'ABORT — release marker is no longer the current main tip.' >&2
            exit 1
          }
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "${authorization}" \
            "${publisher_base}/applications/${package_name}/edits/${edit_id}:commit" \
            >/dev/null

          generated=''
          download_id=''
          for _ in {1..10}; do
            generated="$(curl --fail-with-body --silent --show-error \
              --header "${authorization}" \
              "${publisher_base}/applications/${package_name}/generatedApks/${version_code}")" || true
            printf '%s' "${generated}" > "${RUNNER_TEMP}/generated-apks.json"
            download_id="$(node scripts/play-generated-apk.mjs select "${RUNNER_TEMP}/generated-apks.json" 2>/dev/null || true)"
            [[ -n "${download_id}" ]] && break
            sleep 15
          done
          test -n "${download_id:-}" || {
            echo 'Play did not provide a generated universal APK for the committed testing build.' >&2
            exit 1
          }
          mkdir -p release/play
          curl --fail-with-body --silent --show-error --location \
            --header "${authorization}" \
            "${publisher_base}/applications/${package_name}/generatedApks/${version_code}/downloads/${download_id}:download" \
            --output "release/play/pluris-haven-${PLAY_VERSION}+${PLAY_BUILD}.apk"
          android_tools="${ANDROID_HOME:?Android SDK is not available}/build-tools"
          aapt="$(find "${android_tools}" -type f -name aapt -print | LC_ALL=C sort -V | tail -n 1)"
          apksigner="$(find "${android_tools}" -type f -name apksigner -print | LC_ALL=C sort -V | tail -n 1)"
          test -n "${aapt}" && test -n "${apksigner}" || {
            echo 'Android SDK build tools are required to verify the Play-generated APK.' >&2
            exit 1
          }
          apk="release/play/pluris-haven-${PLAY_VERSION}+${PLAY_BUILD}.apk"
          "${aapt}" dump badging "${apk}" > "${RUNNER_TEMP}/play-apk.badging"
          "${apksigner}" verify --verbose --print-certs "${apk}" > "${RUNNER_TEMP}/play-apk.signer"
          node scripts/play-generated-apk.mjs verify \
            "${RUNNER_TEMP}/play-apk.badging" \
            "${RUNNER_TEMP}/play-apk.signer" \
            "${package_name}" "${PLAY_BUILD}" "${PLAY_VERSION}" \
            "${PLAY_APP_SIGNING_CERT_SHA256}"

      - name: Upload Play-generated universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-play-generated-apk
          path: release/play/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - metadata
      - ios
      - android
      - play-internal
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: official-release
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out protected release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Android artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluris-haven-android-release
          path: release/mobile

      - name: Download Play-generated universal APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluris-haven-play-generated-apk
          path: release/play

      - name: Download unsigned IPA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluris-haven-ios-unsigned
          path: release/mobile

      - name: Sign release artefacts and write metadata
        shell: bash
        env:
          ARTIFACT_PRIMARY_FINGERPRINT: ${{ vars.PLURIS_ARTIFACT_GPG_PRIMARY_FINGERPRINT }}
          ARTIFACT_SIGNING_FINGERPRINT: ${{ vars.PLURIS_ARTIFACT_GPG_SIGNING_FINGERPRINT }}
          ARTIFACT_KEY: ${{ secrets.PLURIS_ARTIFACT_GPG_PRIVATE_KEY }}
          ARTIFACT_PASSPHRASE: ${{ secrets.PLURIS_ARTIFACT_GPG_PASSPHRASE }}
          RELEASE_SHA: ${{ needs.metadata.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          : "${ARTIFACT_KEY:?PLURIS_ARTIFACT_GPG_PRIVATE_KEY is not configured.}"
          : "${ARTIFACT_PASSPHRASE:?PLURIS_ARTIFACT_GPG_PASSPHRASE is not configured.}"
          : "${ARTIFACT_PRIMARY_FINGERPRINT:?Artefact primary fingerprint is not configured.}"
          : "${ARTIFACT_SIGNING_FINGERPRINT:?Artefact signing fingerprint is not configured.}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${RELEASE_SHA}" || {
            echo 'ABORT — release marker is no longer the current main tip.' >&2
            exit 1
          }
          work_dir="${RUNNER_TEMP}/pluris-haven-official-release/artefact-signing"
          rm -rf "${work_dir}"
          mkdir -p "${work_dir}/gnupg"
          chmod 700 "${work_dir}/gnupg"
          export GNUPGHOME="${work_dir}/gnupg"
          trap 'rm -rf "${work_dir}"' EXIT
          printf '%s' "${ARTIFACT_KEY}" | gpg --batch --import
          gpg --batch --with-colons --list-secret-keys > "${work_dir}/secret-keys.colons"
          node scripts/official-release-policy.mjs validate-secret-key \
            "${work_dir}/secret-keys.colons" \
            "${ARTIFACT_PRIMARY_FINGERPRINT}" \
            "${ARTIFACT_SIGNING_FINGERPRINT}"
          printf '%s' "${ARTIFACT_PASSPHRASE}" > "${work_dir}/passphrase"
          chmod 600 "${work_dir}/passphrase"

          mkdir -p release/mobile
          apk="pluris-haven-${{ needs.metadata.outputs.version }}+${{ needs.metadata.outputs.build }}.apk"
          mv "release/play/${apk}" "release/mobile/${apk}"
          {
            echo "version=${{ needs.metadata.outputs.version }}"
            echo "build=${{ needs.metadata.outputs.build }}"
            echo "tag=${{ needs.metadata.outputs.tag }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo 'android_apk=Play-generated universal APK, signed by Google Play App Signing'
            echo 'ios_ipa=unsigned test artefact; not installable or TestFlight evidence'
          } > release/mobile/BUILD.txt

          mapfile -t distributed < <(find release/mobile -maxdepth 1 -type f \( -name '*.aab' -o -name '*.apk' -o -name '*.ipa' \) -printf '%f\n' | LC_ALL=C sort)
          ((${#distributed[@]} > 0)) || { echo 'No distributable release artefacts were found.' >&2; exit 1; }
          for file in "${distributed[@]}"; do
            gpg --batch --pinentry-mode loopback --passphrase-file "${work_dir}/passphrase" \
              --local-user "${ARTIFACT_SIGNING_FINGERPRINT}!" --armor --detach-sign "release/mobile/${file}"
            gpg --batch --verify "release/mobile/${file}.asc" "release/mobile/${file}"
          done
          (
            cd release/mobile
            sha256sum -- "${distributed[@]}" BUILD.txt > SHA256SUMS.txt
          )
          gpg --batch --pinentry-mode loopback --passphrase-file "${work_dir}/passphrase" \
            --local-user "${ARTIFACT_SIGNING_FINGERPRINT}!" --armor --detach-sign release/mobile/SHA256SUMS.txt
          gpg --batch --verify release/mobile/SHA256SUMS.txt.asc release/mobile/SHA256SUMS.txt
          node scripts/official-release-policy.mjs validate-release-artifacts release/mobile

      - name: Upload release artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-mobile-release
          path: release/mobile/*
          if-no-files-found: error

      - name: Create immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.metadata.outputs.release_sha }}
        run: |
          set -euo pipefail

          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${RELEASE_SHA}" || {
            echo 'ABORT — release marker is no longer the current main tip.' >&2
            exit 1
          }
          if gh release view "${{ needs.metadata.outputs.tag }}" >/dev/null 2>&1; then
            echo 'The immutable official GitHub Release already exists; leaving it unchanged.'
            exit 0
          fi
          previous_tag="$(git describe --tags --match 'mobile-v*' --abbrev=0 "${{ needs.metadata.outputs.tag }}^" 2>/dev/null || true)"
          if [[ -n "${previous_tag}" ]]; then
            node scripts/generate-release-notes.mjs --from "${previous_tag}" --to "${{ needs.metadata.outputs.tag }}" > "${RUNNER_TEMP}/release-notes.md"
          else
            node scripts/generate-release-notes.mjs --to "${{ needs.metadata.outputs.tag }}" > "${RUNNER_TEMP}/release-notes.md"
          fi
          gh release create "${{ needs.metadata.outputs.tag }}" \
            release/mobile/* \
            --title "Pluris Haven Mobile ${{ needs.metadata.outputs.version }}+${{ needs.metadata.outputs.build }}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag \
            --prerelease \
            --latest=false

  website-metadata:
    name: Propose website release metadata
    needs:
      - metadata
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: Generate website release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: scripts/update-website-release.sh

      - name: Validate website release metadata
        run: |
          pnpm check
          pnpm build
          pnpm check:a11y
          pnpm check:headers
        working-directory: website

      - name: Commit website release metadata on a pull request branch
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/src/lib/release.ts
          git diff --cached --quiet && { echo 'No website metadata change required.'; exit 0; }
          branch="chore/website-release-${RELEASE_VERSION//[^a-zA-Z0-9]/-}"
          branch="${branch,,}"
          git commit -m "chore(website): update mobile release metadata"
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore(website): update mobile release metadata" \
            --body "Generated after verified release ${{ needs.metadata.outputs.tag }}. This change must pass normal CI and main Rulesets before merge."
