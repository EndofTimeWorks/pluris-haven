name: Mobile Release

on:
  push:
    tags:
      - 'mobile-v*'
      - '!mobile-v*.dev.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          version_with_build="${GITHUB_REF_NAME#mobile-v}"
          if [[ "${version_with_build}" != *"+"* ]]; then
            echo "Mobile release tag must include a numeric build number." >&2
            exit 1
          fi

          version="${version_with_build%%+*}"
          build="${version_with_build##*+}"
          if [[ ! "${version}" =~ ${semver_regex} ]]; then
            echo "Invalid version: ${version}" >&2
            exit 1
          fi
          if [[ ! "${build}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid build number: ${build}" >&2
            exit 1
          fi

          max_tagged_build="$(git tag --list 'mobile-v*+*' | sed -n 's/.*+\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)"
          max_tagged_build="${max_tagged_build:-0}"
          if (( build < max_tagged_build )); then
            echo "Build ${build} is older than the highest tagged mobile build ${max_tagged_build}." >&2
            exit 1
          fi

          prerelease=false
          if [[ "${version}" == 0.* || "${version}" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "version=${version}"
            echo "build=${build}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  ios:
    name: Verify unsigned iOS build
    needs: metadata
    runs-on: macos-26-intel
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Select Xcode 26.4.1
        run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: >
          flutter build ios --release --no-codesign
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build }}"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/ios/unsigned/Payload
          ditto build/ios/iphoneos/Runner.app \
            build/ios/unsigned/Payload/Runner.app
          (
            cd build/ios/unsigned
            ditto -c -k --keepParent Payload \
              "../pluris-haven-${{ needs.metadata.outputs.version }}+${{ needs.metadata.outputs.build }}-unsigned.ipa"
          )

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-ios-unsigned
          path: mobile/build/ios/pluris-haven-*-unsigned.ipa
          if-no-files-found: error

  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: metadata
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter --no-color analyze

      - name: Test
        run: flutter --no-color test

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ../scripts/configure-android-signing.sh

      - name: Build release APK
        run: >
          flutter --no-color build apk --release
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build }}"

      - name: Build split per ABI APKs
        run: >
          flutter --no-color build apk --release --split-per-abi
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build }}"

      - name: Collect Android artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../release/android
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../release/android/pluris-haven-${{ needs.metadata.outputs.version }}+${{ needs.metadata.outputs.build }}-universal.apk"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="${apk#build/app/outputs/flutter-apk/app-}"
            abi="${abi%-release.apk}"
            cp "${apk}" "../release/android/pluris-haven-${{ needs.metadata.outputs.version }}+${{ needs.metadata.outputs.build }}-${abi}.apk"
          done

      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-android-release
          path: release/android/*
          if-no-files-found: error

      - name: Remove Android signing material
        if: always()
        run: rm -f android/key.properties android/app/pluris-haven-upload.jks

  publish:
    name: Publish GitHub release
    needs:
      - metadata
      - ios
      - android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Android artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluris-haven-android-release
          path: release/mobile

      - name: Download unsigned IPA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pluris-haven-ios-unsigned
          path: release/mobile

      - name: Write release metadata
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "version=${{ needs.metadata.outputs.version }}"
            echo "build=${{ needs.metadata.outputs.build }}"
            echo "tag=${{ needs.metadata.outputs.tag }}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release/mobile/BUILD.txt
          (cd release/mobile && sha256sum -- ./*.apk ./*.ipa ./BUILD.txt > SHA256SUMS.txt)

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pluris-haven-mobile-release
          path: release/mobile/*
          if-no-files-found: error

      - name: Create GitHub Release
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          prerelease_flag=()
          latest_flag=()
          if [[ "${{ needs.metadata.outputs.prerelease }}" == "true" ]]; then
            prerelease_flag=(--prerelease)
            latest_flag=(--latest=false)
          else
            prerelease_flag=(--prerelease=false)
            latest_flag=(--latest)
          fi

          if gh release view "${{ needs.metadata.outputs.tag }}" >/dev/null 2>&1; then
            gh release edit "${{ needs.metadata.outputs.tag }}" \
              --title "Pluris Haven Mobile ${{ needs.metadata.outputs.version }}+${{ needs.metadata.outputs.build }}" \
              "${prerelease_flag[@]}" \
              "${latest_flag[@]}"
            gh release upload "${{ needs.metadata.outputs.tag }}" release/mobile/* --clobber
          else
            gh release create "${{ needs.metadata.outputs.tag }}" \
              release/mobile/* \
              --title "Pluris Haven Mobile ${{ needs.metadata.outputs.version }}+${{ needs.metadata.outputs.build }}" \
              --generate-notes \
              --verify-tag \
              "${latest_flag[@]}" \
              "${prerelease_flag[@]}"
          fi
