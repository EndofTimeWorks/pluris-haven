name: Mobile Dev Release

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-dev-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-dev-release-${{ github.run_number }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android dev APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Android signing secrets are not configured." >&2
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/pluris-haven-upload.jks
          {
            echo "storeFile=pluris-haven-upload.jks"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > android/key.properties

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter --no-color analyze

      - name: Test
        run: flutter --no-color test

      - name: Build dev APK
        run: >
          flutter --no-color build apk --debug
          --build-name "0.0.1-pre-alpha.dev.${GITHUB_RUN_NUMBER}"
          --build-number "${GITHUB_RUN_NUMBER}"

      - name: Resolve dev version
        id: version
        shell: bash
        run: |
          version="0.0.1-pre-alpha.dev.${GITHUB_RUN_NUMBER}"
          build="${GITHUB_RUN_NUMBER}"
          tag="mobile-v${version}+${build}"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Collect dev build
        shell: bash
        run: |
          mkdir -p ../release/mobile-dev
          cp build/app/outputs/flutter-apk/app-debug.apk ../release/mobile-dev/pluris-haven-dev.apk
          {
            echo "version=${{ steps.version.outputs.version }}"
            echo "build=${{ steps.version.outputs.build }}"
            echo "tag=${{ steps.version.outputs.tag }}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ../release/mobile-dev/BUILD.txt
          (cd ../release/mobile-dev && sha256sum pluris-haven-dev.apk BUILD.txt > SHA256SUMS.txt)
          cat > ../release/mobile-dev/NOTES.md <<EOF
          Pre-alpha debug build ${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }} from ${GITHUB_SHA}.

          This APK is dev-signed and debuggable. It is for Obtainium/local testing, not Play Store distribution.
          EOF

      - name: Upload dev artifact
        uses: actions/upload-artifact@v7
        with:
          name: pluris-haven-dev-apk
          path: release/mobile-dev/*
          if-no-files-found: error

      - name: Publish dev prerelease
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="${{ steps.version.outputs.tag }}"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" \
              release/mobile-dev/pluris-haven-dev.apk \
              release/mobile-dev/BUILD.txt \
              release/mobile-dev/SHA256SUMS.txt \
              --clobber
          else
            gh release create "${tag}" \
              release/mobile-dev/pluris-haven-dev.apk \
              release/mobile-dev/BUILD.txt \
              release/mobile-dev/SHA256SUMS.txt \
              --target "${GITHUB_SHA}" \
              --title "Pluris Haven Mobile pre-alpha debug ${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}" \
              --notes-file release/mobile-dev/NOTES.md \
              --prerelease \
              --latest=false
          fi
