name: Mobile Dev Release

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-dev-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-dev-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android dev APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve dev version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          version_line="$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          version="${version_line%%+*}"
          build="${version_line##*+}"
          tag="mobile-v${version_line}"

          if [[ -z "${version_line}" || "${version_line}" == "${version}" ]]; then
            echo "mobile/pubspec.yaml must contain a SemVer version with +build metadata." >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ${semver_regex} ]]; then
            echo "Invalid SemVer version: ${version}" >&2
            exit 1
          fi
          if [[ ! "${build}" =~ ^[0-9]+$ ]]; then
            echo "Invalid Android build number: ${build}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-pre-alpha(\.[0-9]+)?\.dev\.[0-9]+$ ]]; then
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
            {
              echo "## Dev APK skipped"
              echo
              echo "Version \`${version_line}\` is not a pre-alpha dev version, so this push is left for the tag-based release workflow."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists. Bump mobile/pubspec.yaml before publishing another dev release." >&2
            exit 1
          fi

          echo "should_publish=true" >> "${GITHUB_OUTPUT}"

      - name: Set up Java
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: steps.version.outputs.should_publish == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Cache Flutter pub
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}

      - name: Install dependencies
        if: steps.version.outputs.should_publish == 'true'
        run: flutter pub get

      - name: Configure Android signing
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Android signing secrets are not configured." >&2
            exit 1
          fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/pluris-haven-upload.jks
          if ! keytool -list -keystore android/app/pluris-haven-upload.jks -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" >/dev/null 2>&1; then
            echo "Android signing key alias was not found in the uploaded keystore." >&2
            echo "Set ANDROID_KEY_ALIAS to the alias used with keytool -genkeypair, usually pluris-haven-upload." >&2
            exit 1
          fi
          {
            echo "storeFile=pluris-haven-upload.jks"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > android/key.properties

      - name: Verify formatting
        if: steps.version.outputs.should_publish == 'true'
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        if: steps.version.outputs.should_publish == 'true'
        run: flutter --no-color analyze

      - name: Test
        if: steps.version.outputs.should_publish == 'true'
        run: flutter --no-color test

      - name: Build dev APK
        if: steps.version.outputs.should_publish == 'true'
        run: >
          flutter --no-color build apk --debug
          --build-name "${{ steps.version.outputs.version }}"
          --build-number "${{ steps.version.outputs.build }}"

      - name: Collect dev build
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        run: |
          mkdir -p ../release/mobile-dev
          cp build/app/outputs/flutter-apk/app-debug.apk ../release/mobile-dev/pluris-haven-dev.apk
          {
            echo "version=${{ steps.version.outputs.version }}"
            echo "build=${{ steps.version.outputs.build }}"
            echo "tag=${{ steps.version.outputs.tag }}"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ../release/mobile-dev/BUILD.txt
          (cd ../release/mobile-dev && sha256sum pluris-haven-dev.apk BUILD.txt > SHA256SUMS.txt)
      - name: Upload dev artifact
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pluris-haven-dev-apk
          path: release/mobile-dev/*
          if-no-files-found: error

      - name: Publish dev prerelease
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="${{ steps.version.outputs.tag }}"

          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"

          notes="$(cat <<EOF
          Pre-alpha debug build ${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }} from ${GITHUB_SHA}.

          This APK is dev-signed and debuggable. It is for Obtainium/local testing, not Play Store distribution.
          EOF
          )"

          gh release create "${tag}" \
            release/mobile-dev/pluris-haven-dev.apk \
            release/mobile-dev/BUILD.txt \
            release/mobile-dev/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "Pluris Haven Mobile pre-alpha debug ${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}" \
            --notes "${notes}" \
            --generate-notes \
            --prerelease \
            --latest=false
