name: Prepare Mobile Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump to prepare"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - pre-alpha
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Custom SemVer without +build, required only for release_type=custom"
        required: false
      build_number:
        description: "Optional Android build number. Defaults to current build + 1."
        required: false

permissions:
  contents: write

concurrency:
  group: prepare-mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version and tag release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Resolve next mobile version
        id: version
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Prepare releases from main only." >&2
            exit 1
          fi

          semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'

          version_line="$(awk '/^version:/ {print $2}' mobile/pubspec.yaml)"
          current_version="${version_line%%+*}"
          current_build="${version_line##*+}"

          if [[ -z "${version_line}" || "${version_line}" == "${current_version}" ]]; then
            echo "mobile/pubspec.yaml must contain version: <semver>+<build>." >&2
            exit 1
          fi
          if [[ ! "${current_build}" =~ ^[0-9]+$ ]]; then
            echo "Current build number is not numeric: ${current_build}" >&2
            exit 1
          fi

          base="${current_version%%-*}"
          IFS='.' read -r major minor patch <<< "${base}"
          if [[ ! "${major}" =~ ^[0-9]+$ || ! "${minor}" =~ ^[0-9]+$ || ! "${patch}" =~ ^[0-9]+$ ]]; then
            echo "Current version is not SemVer-like: ${current_version}" >&2
            exit 1
          fi

          case "${RELEASE_TYPE}" in
            dev)
              if [[ "${current_version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-pre-alpha\.([0-9]+)\.dev\.([0-9]+)$ ]]; then
                next_version="${BASH_REMATCH[1]}-pre-alpha.${BASH_REMATCH[2]}.dev.$((BASH_REMATCH[3] + 1))"
              elif [[ "${current_version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-pre-alpha\.dev\.([0-9]+)$ ]]; then
                next_version="${BASH_REMATCH[1]}-pre-alpha.0.dev.$((BASH_REMATCH[2] + 1))"
              elif [[ "${current_version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-pre-alpha\.([0-9]+)$ ]]; then
                next_version="${BASH_REMATCH[1]}-pre-alpha.${BASH_REMATCH[2]}.dev.1"
              else
                next_version="${base}-pre-alpha.0.dev.1"
              fi
              publish_tag=false
              ;;
            pre-alpha)
              if [[ "${current_version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-pre-alpha\.([0-9]+)\.dev\.[0-9]+$ ]]; then
                next_version="${BASH_REMATCH[1]}-pre-alpha.$((BASH_REMATCH[2] + 1))"
              elif [[ "${current_version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-pre-alpha\.dev\.[0-9]+$ ]]; then
                next_version="${BASH_REMATCH[1]}-pre-alpha.1"
              elif [[ "${current_version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-pre-alpha\.([0-9]+)$ ]]; then
                next_version="${BASH_REMATCH[1]}-pre-alpha.$((BASH_REMATCH[2] + 1))"
              else
                next_version="${base}-pre-alpha.1"
              fi
              publish_tag=true
              ;;
            patch)
              next_version="${major}.${minor}.$((patch + 1))"
              publish_tag=true
              ;;
            minor)
              next_version="${major}.$((minor + 1)).0"
              publish_tag=true
              ;;
            major)
              next_version="$((major + 1)).0.0"
              publish_tag=true
              ;;
            custom)
              if [[ -z "${CUSTOM_VERSION}" ]]; then
                echo "custom_version is required when release_type=custom." >&2
                exit 1
              fi
              next_version="${CUSTOM_VERSION}"
              publish_tag=true
              ;;
            *)
              echo "Unknown release_type: ${RELEASE_TYPE}" >&2
              exit 1
              ;;
          esac

          if [[ -n "${BUILD_NUMBER}" ]]; then
            next_build="${BUILD_NUMBER}"
          else
            next_build="$((current_build + 1))"
          fi

          if [[ ! "${next_version}" =~ ${semver_regex} ]]; then
            echo "Invalid SemVer version: ${next_version}" >&2
            exit 1
          fi
          if [[ ! "${next_build}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid build number: ${next_build}" >&2
            exit 1
          fi

          version_with_build="${next_version}+${next_build}"
          tag="mobile-v${version_with_build}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists: ${tag}" >&2
            exit 1
          fi

          perl -0pi -e "s/^version:\s+\S+/version: ${version_with_build}/m" mobile/pubspec.yaml

          echo "version=${next_version}" >> "${GITHUB_OUTPUT}"
          echo "build=${next_build}" >> "${GITHUB_OUTPUT}"
          echo "version_with_build=${version_with_build}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "publish_tag=${publish_tag}" >> "${GITHUB_OUTPUT}"

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/pubspec.yaml
          git commit -m "chore(release): mobile v${{ steps.version.outputs.version_with_build }}"

      - name: Push version commit
        run: git push origin HEAD:main

      - name: Push release tag
        if: steps.version.outputs.publish_tag == 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag "${tag}"
          git push origin "refs/tags/${tag}"

      - name: Write summary
        shell: bash
        run: |
          {
            echo "## Mobile release prepared"
            echo
            echo "- Version: \`${{ steps.version.outputs.version_with_build }}\`"
            if [[ "${{ steps.version.outputs.publish_tag }}" == "true" ]]; then
              echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
              echo "- Next step: \`mobile-release.yml\` will build APKs from the tag."
            else
              echo "- Dev prerelease: \`mobile-dev-release.yml\` will build the debug APK from the pushed version commit."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
