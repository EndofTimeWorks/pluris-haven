name: Prepare Mobile Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump to prepare"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - pre-alpha
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: "Custom SemVer without +build, required only for release_type=custom"
        required: false
      build_number:
        description: "Optional Android build number. Defaults to current build + 1."
        required: false
      artifact:
        description: "APK type. auto = debug for dev, release otherwise."
        required: true
        default: auto
        type: choice
        options:
          - auto
          - debug
          - release
      draft:
        description: "Create the GitHub release as a draft"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: prepare-mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump, build, tag, and draft release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Resolve next mobile version
        id: version
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Prepare releases from main only." >&2
            exit 1
          fi

          version_line="$(awk '/^version:/ {print $2}' mobile/pubspec.yaml)"
          current_version="${version_line%%+*}"
          current_build="${version_line##*+}"

          if [[ -z "${version_line}" || "${version_line}" == "${current_version}" ]]; then
            echo "mobile/pubspec.yaml must contain version: <semver>+<build>." >&2
            exit 1
          fi
          if [[ ! "${current_build}" =~ ^[0-9]+$ ]]; then
            echo "Current build number is not numeric: ${current_build}" >&2
            exit 1
          fi

          base="${current_version%%-*}"
          IFS='.' read -r major minor patch <<< "${base}"
          if [[ ! "${major}" =~ ^[0-9]+$ || ! "${minor}" =~ ^[0-9]+$ || ! "${patch}" =~ ^[0-9]+$ ]]; then
            echo "Current version is not SemVer-like: ${current_version}" >&2
            exit 1
          fi

          case "${RELEASE_TYPE}" in
            dev)
              if [[ "${current_version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-pre-alpha\.dev\.([0-9]+)$ ]]; then
                next_version="${BASH_REMATCH[1]}-pre-alpha.dev.$((BASH_REMATCH[2] + 1))"
              else
                next_version="${base}-pre-alpha.dev.1"
              fi
              default_artifact="debug"
              ;;
            pre-alpha)
              if [[ "${current_version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-pre-alpha\.([0-9]+)$ ]]; then
                next_version="${BASH_REMATCH[1]}-pre-alpha.$((BASH_REMATCH[2] + 1))"
              else
                next_version="${base}-pre-alpha.1"
              fi
              default_artifact="release"
              ;;
            patch)
              next_version="${major}.${minor}.$((patch + 1))"
              default_artifact="release"
              ;;
            minor)
              next_version="${major}.$((minor + 1)).0"
              default_artifact="release"
              ;;
            major)
              next_version="$((major + 1)).0.0"
              default_artifact="release"
              ;;
            custom)
              if [[ -z "${CUSTOM_VERSION}" ]]; then
                echo "custom_version is required when release_type=custom." >&2
                exit 1
              fi
              next_version="${CUSTOM_VERSION}"
              default_artifact="release"
              ;;
            *)
              echo "Unknown release_type: ${RELEASE_TYPE}" >&2
              exit 1
              ;;
          esac

          if [[ "${ARTIFACT}" == "auto" ]]; then
            artifact="${default_artifact}"
          else
            artifact="${ARTIFACT}"
          fi

          if [[ -n "${BUILD_NUMBER}" ]]; then
            next_build="${BUILD_NUMBER}"
          else
            next_build="$((current_build + 1))"
          fi

          if [[ ! "${next_version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid SemVer version: ${next_version}" >&2
            exit 1
          fi
          if [[ ! "${next_build}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid build number: ${next_build}" >&2
            exit 1
          fi

          version_with_build="${next_version}+${next_build}"
          tag="mobile-v${version_with_build}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists: ${tag}" >&2
            exit 1
          fi

          perl -0pi -e "s/^version:\s+\S+/version: ${version_with_build}/m" mobile/pubspec.yaml

          echo "version=${next_version}" >> "${GITHUB_OUTPUT}"
          echo "build=${next_build}" >> "${GITHUB_OUTPUT}"
          echo "version_with_build=${version_with_build}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "artifact=${artifact}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: flutter pub get
        working-directory: mobile

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ARTIFACT: ${{ steps.version.outputs.artifact }}
        run: |
          set -euo pipefail

          have_signing=false
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" ]]; then
            have_signing=true
          fi

          if [[ "${ARTIFACT}" == "release" && "${have_signing}" != "true" ]]; then
            echo "Release builds require Android signing secrets." >&2
            exit 1
          fi
          if [[ "${have_signing}" != "true" ]]; then
            echo "Android signing secrets not configured; debug build will use the debug key."
            exit 0
          fi

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > mobile/android/app/pluris-haven-upload.jks
          if ! keytool -list -keystore mobile/android/app/pluris-haven-upload.jks -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" >/dev/null 2>&1; then
            echo "Android signing key alias was not found in the uploaded keystore." >&2
            echo "Set ANDROID_KEY_ALIAS to the alias used with keytool -genkeypair, usually pluris-haven-upload." >&2
            exit 1
          fi
          {
            echo "storeFile=pluris-haven-upload.jks"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > mobile/android/key.properties

      - name: Verify formatting
        run: dart format --set-exit-if-changed lib test
        working-directory: mobile

      - name: Analyze
        run: flutter --no-color analyze
        working-directory: mobile

      - name: Test
        run: flutter --no-color test
        working-directory: mobile

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/pubspec.yaml
          git commit -m "chore(release): mobile v${{ steps.version.outputs.version_with_build }} [skip ci]"

      - name: Build debug APK
        if: steps.version.outputs.artifact == 'debug'
        run: >
          flutter --no-color build apk --debug
          --build-name "${{ steps.version.outputs.version }}"
          --build-number "${{ steps.version.outputs.build }}"
        working-directory: mobile

      - name: Build release APKs
        if: steps.version.outputs.artifact == 'release'
        run: |
          flutter --no-color build apk --release \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build }}"
          flutter --no-color build apk --release --split-per-abi \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build }}"
        working-directory: mobile

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          out="release/mobile-prepared"
          mkdir -p "${out}"

          if [[ "${{ steps.version.outputs.artifact }}" == "debug" ]]; then
            cp mobile/build/app/outputs/flutter-apk/app-debug.apk \
              "${out}/pluris-haven-${{ steps.version.outputs.version_with_build }}-debug.apk"
          else
            cp mobile/build/app/outputs/flutter-apk/app-release.apk \
              "${out}/pluris-haven-${{ steps.version.outputs.version_with_build }}-universal.apk"
            for apk in mobile/build/app/outputs/flutter-apk/app-*-release.apk; do
              abi="${apk#mobile/build/app/outputs/flutter-apk/app-}"
              abi="${abi%-release.apk}"
              cp "${apk}" "${out}/pluris-haven-${{ steps.version.outputs.version_with_build }}-${abi}.apk"
            done
          fi

          {
            echo "version=${{ steps.version.outputs.version }}"
            echo "build=${{ steps.version.outputs.build }}"
            echo "artifact=${{ steps.version.outputs.artifact }}"
            echo "tag=${{ steps.version.outputs.tag }}"
            echo "commit=$(git rev-parse HEAD)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${out}/BUILD.txt"
          (cd "${out}" && sha256sum *.apk BUILD.txt > SHA256SUMS.txt)

      - name: Push commit and tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git tag "${tag}"
          git push origin HEAD:main
          git push origin "refs/tags/${tag}"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_args=()
          if [[ "${{ inputs.draft }}" == "true" ]]; then
            release_args+=(--draft)
          fi
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            release_args+=(--prerelease --latest=false)
          fi

          notes="$(cat <<EOF
          Mobile ${{ steps.version.outputs.artifact }} build ${{ steps.version.outputs.version_with_build }}.

          Built by the manual prepare workflow from $(git rev-parse HEAD).
          EOF
          )"

          gh release create "${{ steps.version.outputs.tag }}" \
            release/mobile-prepared/* \
            --target "$(git rev-parse HEAD)" \
            --title "Pluris Haven Mobile ${{ steps.version.outputs.version_with_build }}" \
            --notes "${notes}" \
            --generate-notes \
            "${release_args[@]}"
