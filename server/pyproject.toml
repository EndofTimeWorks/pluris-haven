[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pluris-haven-server"
version = "0.1.0"
description = "Optional account and friend service for Pluris Haven"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.0",
  "alembic>=1.18.0",
  "asyncpg>=0.31.0",
  "email-validator>=2.3.0",
  "fastapi>=0.128.0",
  "httpx>=0.28.0",
  "pwdlib[argon2]>=0.3.0",
  "pydantic-settings>=2.12.0",
  "PyJWT>=2.10.0",
  "sqlalchemy[asyncio]>=2.0.45",
  "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.0.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pluris_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
