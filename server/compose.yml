services:
  api:
    build: .
    restart: unless-stopped
    environment:
      PLURIS_ENVIRONMENT: ${PLURIS_ENVIRONMENT}
      PLURIS_DATABASE_URL: ${PLURIS_DATABASE_URL}
      PLURIS_JWT_SECRET: ${PLURIS_JWT_SECRET}
      PLURIS_FRIEND_CODE_PEPPER: ${PLURIS_FRIEND_CODE_PEPPER}
      PLURIS_ACCESS_TOKEN_MINUTES: ${PLURIS_ACCESS_TOKEN_MINUTES:-15}
      PLURIS_REFRESH_TOKEN_DAYS: ${PLURIS_REFRESH_TOKEN_DAYS:-30}
      PLURIS_REGISTRATION_ENABLED: ${PLURIS_REGISTRATION_ENABLED:-false}
      PLURIS_FRIENDS_ENABLED: ${PLURIS_FRIENDS_ENABLED:-false}
      PLURIS_SERVER_ID: ${PLURIS_SERVER_ID}
      PLURIS_SERVER_NAME: ${PLURIS_SERVER_NAME}
      PLURIS_SERVER_MODE: ${PLURIS_SERVER_MODE:-private}
      PLURIS_SERVER_OPERATOR: ${PLURIS_SERVER_OPERATOR}
      PLURIS_PUBLIC_URL: ${PLURIS_PUBLIC_URL}
      PLURIS_PRIVACY_POLICY_URL: ${PLURIS_PRIVACY_POLICY_URL:-}
      PLURIS_TERMS_URL: ${PLURIS_TERMS_URL:-}
      PLURIS_SUPPORT_EMAIL: ${PLURIS_SUPPORT_EMAIL:-}
      PLURIS_SMTP_HOST: ${PLURIS_SMTP_HOST:-}
      PLURIS_SMTP_PORT: ${PLURIS_SMTP_PORT:-587}
      PLURIS_SMTP_USERNAME: ${PLURIS_SMTP_USERNAME:-}
      PLURIS_SMTP_PASSWORD: ${PLURIS_SMTP_PASSWORD:-}
      PLURIS_SMTP_FROM_EMAIL: ${PLURIS_SMTP_FROM_EMAIL:-}
      PLURIS_PASSWORD_RESET_TOKEN_MINUTES: ${PLURIS_PASSWORD_RESET_TOKEN_MINUTES:-60}
      PLURIS_CORS_ORIGINS: ${PLURIS_CORS_ORIGINS:-}
      PLURIS_TRUSTED_HOSTS: ${PLURIS_TRUSTED_HOSTS:-}
      PLURIS_FORWARDED_ALLOW_IPS: ${PLURIS_FORWARDED_ALLOW_IPS:-}
      PLURIS_BACKUP_OBJECT_DIR: /app/data/backups
      PLURIS_BACKUP_MAX_CHUNK_BYTES: ${PLURIS_BACKUP_MAX_CHUNK_BYTES:-8388608}
      PLURIS_BACKUP_MAX_SNAPSHOTS_PER_USER: ${PLURIS_BACKUP_MAX_SNAPSHOTS_PER_USER:-10}
      PLURIS_BACKUP_MAX_TOTAL_BYTES_PER_USER: ${PLURIS_BACKUP_MAX_TOTAL_BYTES_PER_USER:-1073741824}
      PLURIS_BACKUP_INCOMPLETE_SNAPSHOT_TTL_SECONDS: ${PLURIS_BACKUP_INCOMPLETE_SNAPSHOT_TTL_SECONDS:-86400}
      PLURIS_FRIEND_REQUEST_COOLDOWN_SECONDS: ${PLURIS_FRIEND_REQUEST_COOLDOWN_SECONDS:-86400}
      PLURIS_FRIEND_REQUEST_RATE_LIMIT_ATTEMPTS: ${PLURIS_FRIEND_REQUEST_RATE_LIMIT_ATTEMPTS:-10}
      PLURIS_FRIEND_REQUEST_RATE_LIMIT_WINDOW_SECONDS: ${PLURIS_FRIEND_REQUEST_RATE_LIMIT_WINDOW_SECONDS:-60}
      PLURIS_MAX_BLOCKS_PER_USER: ${PLURIS_MAX_BLOCKS_PER_USER:-1000}
      PLURIS_AUTH_RATE_LIMIT_ATTEMPTS: ${PLURIS_AUTH_RATE_LIMIT_ATTEMPTS:-10}
      PLURIS_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${PLURIS_AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      PLURIS_REFRESH_IP_RATE_LIMIT_ATTEMPTS: ${PLURIS_REFRESH_IP_RATE_LIMIT_ATTEMPTS:-120}
      PLURIS_REFRESH_RETRY_GRACE_SECONDS: ${PLURIS_REFRESH_RETRY_GRACE_SECONDS:-10}
      PLURIS_AUTH_MAX_BODY_BYTES: ${PLURIS_AUTH_MAX_BODY_BYTES:-65536}
      PLURIS_ACCOUNT_CLEANUP_INTERVAL_SECONDS: ${PLURIS_ACCOUNT_CLEANUP_INTERVAL_SECONDS:-3600}
    command:
      [
        'sh',
        '-c',
        'alembic upgrade head && { if [ "$${PLURIS_ENVIRONMENT}" = production ] && [ -z "$${PLURIS_FORWARDED_ALLOW_IPS}" ]; then echo "PLURIS_FORWARDED_ALLOW_IPS is required for production Compose deployments" >&2; exit 1; fi; if [ -n "$${PLURIS_FORWARDED_ALLOW_IPS}" ]; then exec uvicorn pluris_server.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="$${PLURIS_FORWARDED_ALLOW_IPS}"; fi; exec uvicorn pluris_server.main:app --host 0.0.0.0 --port 8000; }',
      ]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - backup-data:/app/data/backups
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import os, urllib.request; from urllib.parse import urlsplit; request = urllib.request.Request('http://127.0.0.1:8000/ready', headers={'Host': urlsplit(os.environ['PLURIS_PUBLIC_URL']).hostname}); urllib.request.urlopen(request, timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:17.11-alpine3.23@sha256:01ea903aa65deb58eb49d6e09d859ecff63a6bb7d61feca55f2abad71d08f72a
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  backup-data:
  postgres-data:
